name: Tests and offline demos

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: python -m pip install .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Sector ETF synthetic demo
        run: python -m quant_research demo --output outputs/demo
      - name: Stock synthetic demo
        run: python -m quant_research demo --family stocks --output outputs/stock_demo
      - name: Current-date sector dashboard and validation demo
        run: python -m quant_research refresh --demo --output outputs/v011_demo
