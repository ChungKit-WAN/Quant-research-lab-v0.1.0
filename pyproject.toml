[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-lab"
version = "0.1.0"
description = "Monthly sector ETF allocation and stock-factor research with shared portfolio accounting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3",
    "pandas==3.0.6",
    "exchange-calendars==4.13.2",
    "yfinance==1.7.0",
]

[project.scripts]
quant-research = "quant_research.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_research*", "sector_backtest*", "hkquant*"]
